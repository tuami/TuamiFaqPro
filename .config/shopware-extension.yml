compatibility_date: '2026-02-11'
build:
  # Build for the oldest supported 6.7 version, not a newer API surface.
  shopwareVersionConstraint: '~6.7.0'
  zip:
    assets:
      enable_es_build_for_admin: true
      enable_es_build_for_storefront: true
    pack:
      excludes:
        paths:
          - tests
          - tools
          - .agents
          - .codex
          - .github
          - '*.zip'
