name: Publish release 1.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Shopware plugin ZIP
        shell: bash
        run: |
          mkdir -p package/TuamiFaqPro
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='TuamiFaqPro.zip' \
            ./ package/TuamiFaqPro/
          cd package
          zip -rq ../TuamiFaqPro.zip TuamiFaqPro

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.1.0 TuamiFaqPro.zip \
            --target "$GITHUB_SHA" \
            --title "TUAMI FAQ Pro 1.1.0" \
            --latest \
            --notes "Neue Layoutauswahl mit Karten und Trennlinien. Die Farbe der Trennlinien kann pro Verkaufskanal konfiguriert werden."
